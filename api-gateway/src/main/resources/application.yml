# src/main/resources/application.yml
server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: userservice
          uri: http://localhost:8081
          predicates:
            - Path=/api/users/**

        - id: orderservice
          uri: http://localhost:8082
          predicates:
            - Path=/api/orders/**

        - id: livestreamservice
          uri: http://localhost:8083
          predicates:
            - Path=/api/livestream/**